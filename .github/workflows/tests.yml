name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r catalog/requirements.txt
      - name: Formatting
        run: npm run format:check
      - name: IV reading rules
        run: npm run test:unit
      - name: Memory bridge against a fake Eden
        run: npm run test:bridge
      - name: Generated catalogue
        run: npm run test:catalog
      - name: Web UI in headless Chrome
        run: npm run test:ui
